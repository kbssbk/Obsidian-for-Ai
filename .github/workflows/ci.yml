name: 라이프 OS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: 설치용 플러그인 파일 모으기
        run: |
          mkdir -p dist/obsidian-for-ai
          cp main.js manifest.json styles.css dist/obsidian-for-ai/
      - name: 설치용 빌드 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 라이프-OS-옵시디언-플러그인
          path: dist/obsidian-for-ai
